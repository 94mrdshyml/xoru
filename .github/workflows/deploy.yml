name: CI & Deployment Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  unit-and-typecheck:
    name: 1. Unit Tests & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install

      - name: Frontend Typecheck
        run: bun --cwd apps/frontend run typecheck

      - name: Backend Typecheck
        run: bun --cwd apps/backend run typecheck

      - name: Backend Vitest Unit Tests
        run: bun --cwd apps/backend run test

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: apps/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/frontend/bun.lock', 'apps/frontend/package.json') }}-${{ hashFiles('apps/frontend/app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Frontend Build Verification
        run: bun --cwd apps/frontend run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  e2e-tests:
    name: 2. Playwright E2E Tests
    needs: unit-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Node Dependencies
        run: bun install

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/frontend

      - name: Run Playwright E2E Tests
        run: bun run test:e2e
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 14

  deploy-backend:
    name: 3. Deploy Backend Worker (xoru-backend)
    needs: [unit-and-typecheck, e2e-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install

      - name: Deploy Backend Worker Secrets
        run: |
          echo "${{ secrets.NEON_DATABASE_URL }}" | bunx wrangler secret put NEON_DATABASE_URL
          echo "${{ secrets.CLERK_SECRET_KEY }}" | bunx wrangler secret put CLERK_SECRET_KEY
        working-directory: apps/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Backend Worker to Cloudflare
        run: bunx wrangler deploy
        working-directory: apps/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-frontend:
    name: 4. Deploy Frontend Pages (xoru-frontend)
    needs: [deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: apps/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/frontend/bun.lock', 'apps/frontend/package.json') }}-${{ hashFiles('apps/frontend/app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install Dependencies & Build with next-on-pages
        run: |
          bun install
          bun run build
          bunx @cloudflare/next-on-pages
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Deploy Frontend Pages Secrets
        run: |
          echo "${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" | bunx wrangler pages secret put NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY --project-name xoru-frontend
          echo "${{ secrets.CLERK_SECRET_KEY }}" | bunx wrangler pages secret put CLERK_SECRET_KEY --project-name xoru-frontend
          echo "${{ secrets.NEON_DATABASE_URL }}" | bunx wrangler pages secret put NEON_DATABASE_URL --project-name xoru-frontend
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Frontend to Cloudflare Pages
        run: bunx wrangler pages deploy .vercel/output/static --project-name xoru-frontend --commit-dirty=true
        working-directory: apps/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
