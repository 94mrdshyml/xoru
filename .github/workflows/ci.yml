name: CI Pipeline

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-checks:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node & Python Dependencies
        run: |
          bun install
          pip install -r apps/backend/requirements.txt pytest pytest-asyncio

      - name: Frontend Typecheck
        run: bun --cwd apps/frontend run typecheck

      - name: Backend Pytest Suite
        run: python -m pytest

      - name: Frontend Build Verification
        run: bun --cwd apps/frontend run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
